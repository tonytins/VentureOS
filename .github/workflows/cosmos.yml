# Builds the VentureOS kernel with the Cosmos toolchain.
# The Cosmos CLI, patcher, and toolchain bundles are cached per Cosmos version:
# restored before installing, and saved right after a fresh install, so they're
# only downloaded when the version pinned in the project changes.

name: Cosmos

on:
  push:
    branches: [
      "main",
      "feature/*",
      "v*"
    ]
  pull_request:
    branches: [
      "main",
      "feature/*",
      "v*"
    ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: false
  PROJECT: Venture.OS
  PROJECT_DIR: src/Venture.OS

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        # GitInfo counts commits since GitInfo.txt changed, so it needs full history.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Kernel-free code is tested on ordinary .NET first, before the Cosmos toolchain is set up.
    - name: Test
      run: dotnet test --project src/Venture.OS.Common.Tests

    - name: Read Cosmos version
      id: cosmos
      run: |
        version=$(sed -n 's|.*Sdk="Cosmos.Sdk/\([^"]*\)".*|\1|p' "$PROJECT_DIR/$PROJECT.csproj")
        if [ -z "$version" ]; then
          echo "::error::Couldn't read the Cosmos.Sdk version from $PROJECT_DIR/$PROJECT.csproj"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Restore Cosmos tools
      id: restore-tools
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cosmos
          ~/.dotnet/tools
        key: cosmos-tools-${{ runner.os }}-${{ steps.cosmos.outputs.version }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Add .NET tools to PATH
      run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    # Both installs run every time so anything outside the cached folders is set up too.
    # With the cache restored, they find the CLI and the toolchain bundles already in place.
    - name: Install Cosmos CLI
      run: dotnet tool update -g Cosmos.Tools --version ${{ steps.cosmos.outputs.version }}

    - name: Install Cosmos toolchain
      run: cosmos install -y

    - name: Save Cosmos tools
      if: steps.restore-tools.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cosmos
          ~/.dotnet/tools
        key: ${{ steps.restore-tools.outputs.cache-primary-key }}

    - name: Validate toolchain
      run: cosmos check

    - name: Build
      run: cosmos build -v -p "$PROJECT_DIR"
